<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mel</title>
    <style>
        /* Diseño del fondo y texto general */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            /* Degradado de negro a un rojo oscuro y luego morado */
            background: linear-gradient(135deg, #000000 30%, #5c0000 70%, #300052 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Estilos del texto principal */
        h1 {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        /* Diseño del botón rosa */
        .btn-rosa {
            background-color: #ff66b2; /* Rosa llamativo */
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s, background-color 0.2s;
        }

        /* Efecto al pasar el mouse sobre el botón */
        .btn-rosa:hover {
            transform: scale(1.1);
            background-color: #ff4d99;
        }

        /* Ocultar la segunda página al inicio */
        #pagina2 {
            display: none; 
        }

        /* Espacio para la lista de canciones */
        #lista-canciones {
            font-size: 1.2rem;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <!-- PRIMERA PANTALLA -->
    <div id="pagina1">
        <h1>te amo mel</h1>
        <button class="btn-rosa" onclick="cambiarPagina()">siguiente</button>
    </div>

    <!-- SEGUNDA PANTALLA (Aparece al dar clic) -->
    <div id="pagina2">
        <h2>canciones que me recuerdan a ti</h2>
        <div id="lista-canciones">
            <!-- Aquí agregaremos las canciones más adelante -->
            <p><em>(Aquí irá la música)</em></p>
        </div>
    </div>

    <!-- Script para hacer funcionar el botón -->
    <script>
        function cambiarPagina() {
            // Oculta la página 1
            document.getElementById('pagina1').style.display = 'none';
            // Muestra la página 2
            document.getElementById('pagina2').style.display = 'block';
        }
    </script>
</body>
</html>
