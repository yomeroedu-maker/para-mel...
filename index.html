<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para Mel</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
</head>

<body>

    <!-- FONDO -->
    <div class="fondo">
        <div class="onda onda-1"></div>
        <div class="onda onda-2"></div>
        <div class="onda onda-3"></div>

        <div class="particulas"></div>
    </div>


    <!-- ========================= -->
    <!-- PRIMERA PANTALLA -->
    <!-- ========================= -->

    <main id="pagina1" class="pantalla activa">

        <div class="contenido-inicial">

            <h1>te amo mel</h1>

            <button id="btnSiguiente" class="btn-siguiente">
                siguiente
            </button>

        </div>

    </main>


    <!-- ========================= -->
    <!-- SEGUNDA PANTALLA -->
    <!-- ========================= -->

    <main id="pagina2" class="pantalla">

        <div class="contenido-musica">

            <h2>canciones que me recuerdan a ti</h2>

            <p class="subtitulo">
                cada canción me hace pensar en ti
            </p>


            <!-- ========================= -->
            <!-- SPOTIFY -->
            <!-- ========================= -->

            <div class="spotify-reproductor">

                <iframe
                    id="spotifyPlayer"
                    src="https://open.spotify.com/embed/track/4yakD6EKEjeMezENNCSlcc"
                    width="100%"
                    height="352"
                    frameborder="0"
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                    loading="lazy">
                </iframe>

            </div>


            <!-- ========================= -->
            <!-- LISTA DE CANCIONES -->
            <!-- ========================= -->

            <div class="lista-contenedor">

                <ul id="lista-canciones">

                    <li class="cancion activa" data-index="0">
                        <span class="numero">01</span>
                        <span>Qué Nivel de Mujer</span>
                    </li>

                    <li class="cancion" data-index="1">
                        <span class="numero">02</span>
                        <span>Suave</span>
                    </li>

                    <li class="cancion" data-index="2">
                        <span class="numero">03</span>
                        <span>Tu Mirada</span>
                    </li>

                    <li class="cancion" data-index="3">
                        <span class="numero">04</span>
                        <span>Eres</span>
                    </li>

                    <li class="cancion" data-index="4">
                        <span class="numero">05</span>
                        <span>Mujer de Fuego</span>
                    </li>

                    <li class="cancion" data-index="5">
                        <span class="numero">06</span>
                        <span>Luz de Luna</span>
                    </li>

                    <li class="cancion" data-index="6">
                        <span class="numero">07</span>
                        <span>O Tú o Ninguna</span>
                    </li>

                    <li class="cancion" data-index="7">
                        <span class="numero">08</span>
                        <span>Sol, Arena y Mar</span>
                    </li>

                    <li class="cancion" data-index="8">
                        <span class="numero">09</span>
                        <span>Amarte es un Placer</span>
                    </li>

                    <li class="cancion" data-index="9">
                        <span class="numero">10</span>
                        <span>Cuestión de Piel</span>
                    </li>

                </ul>

            </div>

        </div>

    </main>


    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script src="script.js"></script>

</body>
</html>
